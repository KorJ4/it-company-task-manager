{% extends "base.html" %}

{% block content %}
  <div class="card login-card p-4">
    <h1 class="page-title h4 mb-1"><i class="bi bi-kanban text-primary"></i> IT Task Manager</h1>
    <p class="text-muted">Sign in to see your team's tasks.</p>
    {% if form.errors %}
      <div class="alert alert-danger py-2">Invalid username or password.</div>
    {% endif %}
    <form method="post" action="{% url 'login' %}">
      {% csrf_token %}
      <div class="mb-3">
        <label for="id_username" class="form-label">Username</label>
        <input type="text" name="username" id="id_username" class="form-control" autofocus required>
      </div>
      <div class="mb-3">
        <label for="id_password" class="form-label">Password</label>
        <input type="password" name="password" id="id_password" class="form-control" required>
      </div>
      <input type="hidden" name="next" value="{{ next }}">
      <button type="submit" class="btn btn-primary w-100">Login</button>
    </form>
  </div>
{% endblock %}

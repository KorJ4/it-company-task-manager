{% extends "base.html" %}

{% block content %}
  <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
    <h1 class="page-title h3 mb-0">Task types</h1>
    <a href="{% url 'task_manager:task-type-create' %}" class="btn btn-primary"><i class="bi bi-plus-lg"></i> New task type</a>
  </div>
  {% include "includes/search_form.html" %}
  {% if tasktype_list %}
    <div class="card">
      <ul class="list-group list-group-flush">
        {% for item in tasktype_list %}
          <li class="list-group-item d-flex justify-content-between align-items-center">
            <span class="fw-semibold">{{ item.name }}</span>
            <span class="d-flex gap-3">
              <a href="{% url 'task_manager:task-type-update' pk=item.id %}" title="Edit"><i class="bi bi-pencil"></i></a>
              <a href="{% url 'task_manager:task-type-delete' pk=item.id %}" class="text-danger" title="Delete"><i class="bi bi-trash"></i></a>
            </span>
          </li>
        {% endfor %}
      </ul>
    </div>
  {% else %}
    <p class="text-muted">The list is empty.</p>
  {% endif %}
{% endblock %}
